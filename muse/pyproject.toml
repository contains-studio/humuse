[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openpin-muse"
version = "0.1.0"
description = "Muse voice backend for an OpenPin-enabled Humane Ai Pin"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10,<4",
  "musegadget @ git+https://github.com/facebookincubator/muse-gadget-sdk.git@7e7123e2815d3e7e3c0f2ca330f576290ae6a6a9#subdirectory=linux",
  "qrcode[pil]>=8,<9",
]

[project.scripts]
openpin-muse = "openpin_muse.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
